<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sube y gira tu imagen</title>
  <style>
    body {
      margin: 0; padding: 24px; min-height: 100vh;
      display: grid; place-items: center;
      background: #10131a; color: white;
      font: 16px system-ui, sans-serif;
    }
    main { width: min(100%, 560px); text-align: center; }
    input { margin: 20px 0; max-width: 100%; }
    #stage {
      height: 360px; display: grid; place-items: center;
      perspective: 900px; overflow: hidden;
      background: #202631; border-radius: 16px;
    }
    #photo {
      display: none; max-width: 90%; max-height: 90%;
      object-fit: contain; border-radius: 8px;
      transform: rotateY(0deg);
      box-shadow: 0 12px 30px #0008;
    }
    input[type="range"] { width: min(100%, 420px); }
    p { color: #c6ccd6; }
  </style>
</head>
<body>
  <main>
    <h1>Sube y gira tu imagen</h1>
    <p>Elige una foto y mueve el control para girarla.</p>
    <input id="file" type="file" accept="image/*">
    <div id="stage"><img id="photo" alt="Vista previa de tu imagen"></div>
    <p>Giro: <span id="value">0°</span></p>
    <input id="turn" type="range" min="0" max="360" value="0"
           aria-label="Giro de la imagen">
  </main>
  <script>
    const file = document.querySelector("#file");
    const photo = document.querySelector("#photo");
    const turn = document.querySelector("#turn");
    const value = document.querySelector("#value");
    let oldUrl;

    file.addEventListener("change", () => {
      const image = file.files[0];
      if (!image) return;
      if (oldUrl) URL.revokeObjectURL(oldUrl);
      oldUrl = URL.createObjectURL(image);
      photo.src = oldUrl;
      photo.style.display = "block";
      turn.value = 0;
      photo.style.transform = "rotateY(0deg)";
      value.textContent = "0°";
    });

    turn.addEventListener("input", () => {
      photo.style.transform = `rotateY(${turn.value}deg)`;
      value.textContent = `${turn.value}°`;
    });
  </script>
</body>
</html>
